[project]
name = "crawtools"
description = "miscellanous tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Wayne Crawford", email = "crawford@ipgp.fr"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    'cartopy>=0.18',
    'numpy>=2.0',
    'matplotlib>=3.0',
    'obspy>=1.4',
    'tiskitpy >= 2.3.1'
]
keywords = ['software']
dynamic = ["version"]

[project.scripts]
driftplot = "crawtools.driftplot:main"
driftcorrect = "crawtools.driftcorrect:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "crawtools.version.__version__"}

[tool.setuptools.package-data]
mypkg = ["dec*"]

[project.urls]
Repository = "https://github.com/WayneCrawford/crawtools.git"
Documentation = "https://crawtools.readthedocs.io/latest/"
Changelog = "https://github.com/WayneCrawford/crawtools/blob/master/CHANGELOG.md"
Issues = "https://github.com/WayneCrawford/crawtools/issues"

[project.optional-dependencies]
test = ["pytest"]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]