site_name: crawtools
site_url: https://crawtools.readthedocs.org

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - yaml

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - crawtools
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true

nav:
  - Home: index.md
  - API Reference:
    - Instruments: api/instruments.md
    - Clock Drift: api/clockdrift.md
    - Compliance: api/compliance.md
    - FDSN: api/fdsn.md
    - Mapping: api/mapping.md
    - Rotation Seismometer: api/rotation_seismometer.md
    - Webb Data File: api/webb_data_file.md